[package]
name = "educlaw-server"
version = "0.1.0"
edition = "2021"
description = "EduClaw backend: ACP-over-WebSocket bridge, session isolation, and student registry"

[[bin]]
name = "educlaw-server"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP + WebSocket server
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# WebSocket upgrade
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# SQLite (async)
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "macros"] }

# JWT authentication
jsonwebtoken = "9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUIDs for session IDs
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config via environment
dotenvy = "0.15"

# Password hashing
argon2 = "0.5"

# Error handling
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Futures utilities (stream extensions for WebSocket)
futures-util = "0.3"

# axum-extra for typed headers (Authorization: Bearer)
axum-extra = { version = "0.9", features = ["typed-header"] }

# Directory walking for file browser
walkdir = "2"

# Base64 encoding for image data-URLs
base64 = "0.22"

# Security hardening
seccompiler = "0.5"
libc = "0.2"

# Goose ACP protocol (SACP client)
agent-client-protocol-schema = { version = "0.11", features = ["unstable"] }
sacp = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9", features = ["unstable"] }
tokio-util = { version = "0.7", features = ["compat"] }

[patch.crates-io]
# Use the same symposium-acp revision as goose workspace
sacp = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9", features = ["unstable"] }
sacp-derive = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9" }
