[package]
name = "educlaw-server"
version = "0.1.0"
edition.workspace = true
description = "EduClaw backend: ACP-over-WebSocket bridge, session isolation, and student registry"

[[bin]]
name = "educlaw-server"
path = "src/main.rs"

[dependencies]
educlaw-helix = { path = "../educlaw-helix" }

# Async runtime
tokio.workspace = true

# HTTP + WebSocket server
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# WebSocket upgrade
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# JWT authentication
jsonwebtoken = "9"

# Serialization
serde.workspace = true
serde_json.workspace = true

# UUIDs for session IDs
uuid.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }

# Config via environment
dotenvy = "0.15"

# Password hashing
argon2 = "0.5"

# Error handling
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true

# Time
chrono.workspace = true

# Futures utilities (stream extensions for WebSocket)
futures-util = "0.3"

# axum-extra for typed headers (Authorization: Bearer)
axum-extra = { version = "0.9", features = ["typed-header"] }

# Directory walking for file browser
walkdir = "2"

# Base64 encoding for image data-URLs
base64 = "0.22"

# Security hardening (libc used by ensure_host_networking for geteuid check)
libc = "0.2"

# Hashing (session_id → IP block mapping)
blake3 = "1.5"

# Container runtime (Youki — OCI container lifecycle)
libcontainer = { version = "0.6.0", default-features = false, features = ["v2", "systemd"] }
nix = "0.29"

# Goose ACP protocol (SACP client)
agent-client-protocol-schema = { version = "0.11", features = ["unstable"] }
sacp = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9", features = ["unstable"] }
goose-sdk = { path = "../goose-workspace/crates/goose-sdk" }
tokio-util = { version = "0.7", features = ["compat"] }

[patch.crates-io]
# Use the same symposium-acp revision as goose workspace
sacp = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9", features = ["unstable"] }
sacp-derive = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9" }
