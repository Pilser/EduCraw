[workspace]
members = [
    "educlaw-server",
    "educlaw-helix",
]
resolver = "2"

# Required because educlaw-server depends on goose-sdk via path,
# and goose-sdk uses workspace inheritance for these fields.
[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.91.1"
authors = ["AAIF"]
license = "Apache-2.0"
repository = ""
description = "EduClaw"

[workspace.dependencies]
# Shared deps
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
thiserror = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "1.0", features = ["derive"] }

# goose-sdk deps (needed for workspace inheritance)
agent-client-protocol-schema = { version = "0.11", features = ["unstable"] }
sacp = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9", features = ["unstable"] }

[patch.crates-io]
sacp = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9" }
sacp-derive = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9" }
